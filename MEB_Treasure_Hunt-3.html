<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7256B5">
<title>M.E.B | Treasure Hunt</title>
<style>
:root{--purple:#7256b5;--deep:#302345;--lav:#f4f0ff;--muted:#817492;--line:#eae5f1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;background:linear-gradient(145deg,#f8f5ff,#eee8fb);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--deep);display:flex;justify-content:center;align-items:center}
.wrap{width:min(100%,480px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}
.logo{background:var(--purple);color:white;font-weight:900;font-size:23px;letter-spacing:1px;padding:12px 15px;border-radius:13px}
.tag{font-size:11px;letter-spacing:1.5px;color:var(--purple);border:1px solid #d8ccef;padding:8px 11px;border-radius:30px;font-weight:700}
h1{font-size:clamp(32px,8vw,43px);line-height:1.08;margin:0 0 10px;letter-spacing:-1.5px}
h1 span{color:var(--purple)}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 24px}
.panel{background:white;border-radius:23px;padding:25px;box-shadow:0 14px 40px #47326b12}
.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;color:var(--muted);margin:0 0 10px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:16px;font:inherit;font-size:17px;color:var(--deep);outline:none;background:#faf9fc}
input:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7256b51a}
button{border:0;border-radius:13px;padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer}
.primary{width:100%;margin-top:13px;background:var(--purple);color:white;box-shadow:0 7px 16px #7256b533}
.primary:active,button:active{transform:translateY(1px)}
.result{margin-top:17px;padding:18px;border-radius:15px;display:none}
.result.success{display:block;background:#ede8fa}
.result.error{display:block;background:#fff0ee}
.result small{display:block;font-weight:800;letter-spacing:1px;margin-bottom:8px;color:#7256b5}
.result.error small{color:#b44c48}
.result strong{font-size:22px;overflow-wrap:anywhere}
.footer{font-size:10px;color:#a095b0;text-align:center;letter-spacing:1.7px;margin-top:20px}
.admin{margin-top:18px;border-top:1px solid var(--line);padding-top:17px}
.admin-toggle{background:transparent;color:var(--purple);padding:8px 0;font-size:13px}
.admin-box{display:none;margin-top:12px}
.admin-box.open{display:block}
.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 12px}
textarea{font-size:14px;line-height:1.7;min-height:155px;resize:vertical}
.secondary{width:100%;margin-top:10px;background:#eee9f7;color:#59477c}
.note{font-size:11px;color:#a095b0;line-height:1.6;margin-top:12px}
@media(max-width:380px){body{padding:18px 13px}.panel{padding:20px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="logo">M.E.B</div>
    <div class="tag">TREASURE HUNT</div>
  </header>
  <h1>Find Your<br><span>Treasure.</span></h1>
  <p class="subtitle">찾은 문제의 번호를 입력하고 정답을 확인해 보세요!</p>

  <section class="panel">
    <p class="eyebrow">QUESTION NUMBER</p>
    <input id="questionNumber" type="text" inputmode="numeric" placeholder="문제 번호 입력 (예: 1)" autocomplete="off">
    <button class="primary" id="checkButton">정답 확인하기&nbsp; →</button>
    <div class="result" id="result" role="status" aria-live="polite">
      <small id="resultLabel"></small>
      <strong id="resultText"></strong>
    </div>
    <div class="footer">M.E.B · THINK · FIND · WIN</div>

    <div class="admin">
      <button class="admin-toggle" id="adminToggle" aria-expanded="false">⚙ 관리자 설정 · 문제와 정답 등록</button>
      <div class="admin-box" id="adminBox">
        <p class="eyebrow">ANSWER LIST</p>
        <p class="hint">한 줄에 하나씩 입력하세요. 문제 번호와 정답은 = 기호로 구분합니다.<br>예시: <b>1=세종대왕</b></p>
        <textarea id="answerList" spellcheck="false" placeholder="1=세종대왕&#10;2=서울&#10;3=한글"></textarea>
        <button class="secondary" id="saveButton">저장하기</button>
        <p class="note">등록한 답은 이 브라우저에 저장됩니다. 다른 기기에서도 사용하려면 각 기기에서 같은 답안을 등록하거나, 이 HTML 파일을 공유해 주세요.</p>
      </div>
    </div>
  </section>
</main>
<script>
const DEFAULT_ANSWERS = `1=정답을 입력하세요
2=정답을 입력하세요
3=정답을 입력하세요`;
const STORAGE_KEY = "meb_treasure_answers_v1";
const numberInput = document.getElementById("questionNumber");
const result = document.getElementById("result");
const resultLabel = document.getElementById("resultLabel");
const resultText = document.getElementById("resultText");
const answerList = document.getElementById("answerList");
const adminBox = document.getElementById("adminBox");
const adminToggle = document.getElementById("adminToggle");

function getAnswersText(){
  try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_ANSWERS; }
  catch(e) { return DEFAULT_ANSWERS; }
}
answerList.value = getAnswersText();

function showResult(type, label, message){
  result.className = "result " + type;
  resultLabel.textContent = label;
  resultText.textContent = message;
}
function checkAnswer(){
  const number = numberInput.value.trim();
  if(!number){
    showResult("error","CHECK AGAIN","문제 번호를 입력해 주세요.");
    numberInput.focus();
    return;
  }
  const answers = getAnswersText().split(/\r?\n/).map(line=>{
    const index = line.indexOf("=");
    if(index < 0) return null;
    return [line.slice(0,index).trim(), line.slice(index+1).trim()];
  }).filter(item=>item && item[0] && item[1]);
  const found = answers.find(item=>item[0] === number);
  if(found) showResult("success","ANSWER FOUND",found[1]);
  else showResult("error","NOT FOUND","등록되지 않은 문제 번호예요.");
}
document.getElementById("checkButton").addEventListener("click",checkAnswer);
numberInput.addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer();});
numberInput.addEventListener("input",()=>{result.className="result";});
adminToggle.addEventListener("click",()=>{
  const open = adminBox.classList.toggle("open");
  adminToggle.setAttribute("aria-expanded",String(open));
});
document.getElementById("saveButton").addEventListener("click",()=>{
  const text = answerList.value;
  const valid = text.split(/\r?\n/).some(line=>{
    const i=line.indexOf("=");
    return i>0 && line.slice(0,i).trim() && line.slice(i+1).trim();
  });
  if(!valid){alert("문제 번호=정답 형식으로 한 개 이상 입력해 주세요.");return;}
  try{
    localStorage.setItem(STORAGE_KEY,text);
    showResult("success","SAVED","문제와 정답이 저장됐어요!");
  }catch(e){
    alert("브라우저 저장이 제한되어 있어요. 다른 브라우저에서 다시 열어 주세요.");
  }
});
</script>
</body>
</html>
